# Work Judgment Phase 1C evaluation suite - version phase1c-v2
# Derived from eval-run/suite-phase1b-v1.yaml (30 cases) WITHOUT modifying it.
# Deltas vs phase1b are documented per case under `delta_vs_phase1b`.
#
# Phase 1C changes (Ben decisions 2026-09-28):
# 1. MERGE: gold select_artifact `work_item_change` -> `result` (4 cases:
#    wj-001, wj-010, wj-016, wj-030). Canonical select_artifact.json retired
#    work_item_change; survivor is result.
# 2. SPLIT: gold classify_data_type `request` -> `quality_failure` for the
#    botched-deliverable cases (3 cases: wj-002, wj-003, wj-009). Canonical
#    classify_data_type.json now carries incident (operational) and
#    quality_failure (deliverable quality) as active choices.
#
# Phase 1C v2 (Ben decision 2026-09-28): re-gold wj-011 classify_data_type
# `incident` -> `quality_failure` (bad audit report = defective deliverable).
# No other changes; suite-phase1c-v1.yaml and all earlier suites untouched.
suite: work-judgment-phase1c
suite_version: phase1c-v2
baseline_suite: eval-run/suite-phase1b-v1.yaml @ work/eval-phase1b-2026-09-28 (untouched)
composition:
  carried_over: 30
  new_synthetic: 0
  total: 30
vocabulary_amendments:
- function: select_artifact
  amendment: retired choice `work_item_change`, superseded by `result`
  definition: 'Durable outcome of a governed lifecycle transition: the work item''s state update plus linked evidence and
    the accepted/rejected outcome.'
  provenance: 'Phase 1B finding: systematic result->work_item_change confusion on close intent (4/4); Ben decision 2026-09-28:
    merge, keep result. Canonical config: origin/work/work-judgment-vocab-v1c examples/work-judgment/select_artifact.json'
  review_rules: unchanged
- function: classify_data_type
  amendment: added choices `incident` and `quality_failure` to canonical config
  definitions:
    incident: 'An operational failure or disruption requiring response - outage, data loss, security event, or similar. Distinct
      from quality_failure: the system or operation is broken, not merely its output.'
    quality_failure: 'A delivered work product that is broken, incomplete, or falsely claimed as complete/verified - the deliverable
      itself is defective. Distinct from incident (operational failure): the system works, the output doesn''t.'
  provenance: 'Phase 1B: incident corpus proved a real missing type (4/4 with suite-level candidate); botched-deliverable
    cases had no home. Ben decision 2026-09-28: split incident (operational only) vs quality_failure (deliverable quality).
    Canonical config: origin/work/work-judgment-vocab-v1c examples/work-judgment/classify_data_type.json'
  review_rules: unchanged
classification_definition: classify_data_type judges the SEMANTIC OBJECT TYPE of the item (what the thing is in domain terms),
  not its source/container. source_type is recorded separately per case and passed as input.
cases:
- id: wj-001
  source:
    kind: approved_eval
    ref: master-repo:evals/datasets/agent-behavior-v1.json#agent-behavior-003
  observation:
    summary: User already said 'fix gap' for a small reversible documentation change; agent asked for another approval.
  expected:
    classify_data_type: request
    next_intent: execute
    select_artifact: result
    select_playbook: implementation
    requires_human_gate: false
    evidence_satisfies_exit: false
  rationale: 'The go-ahead already exists. The work is small/reversible and execution is the next intent. No completion evidence
    exists yet.

    '
  source_type: agent-behavior eval case
  context:
    current_state: User already approved the small reversible documentation fix ('fix gap'); agent re-asked for approval instead
      of executing.
    known_decisions:
    - user approval for the documentation fix ('fix gap')
  gate_context:
    proposed_action: execute the small reversible documentation fix
    existing_approval: true
  delta_vs_phase1b: 'expected.select_artifact: work_item_change -> result. Provenance: vocabulary merge 2026-09-28 (Ben decision:
    merge, keep result; canonical select_artifact.json retired work_item_change, superseded by result).'
- id: wj-002
