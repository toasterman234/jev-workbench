    the visual verification exit condition.

    '
  source_type: agent-behavior eval case
  context:
    current_state: Delivered as 'verified end-to-end' on API/HTTP evidence only; no real browser render observed; user saw
      an error.
    browser_or_ui_in_scope: true
  evidence_context:
    required_evidence:
    - real browser render observed
    available_evidence:
    - API/HTTP health evidence
    verification_summary: API/HTTP checks only; no browser render observed; user saw an error
    browser_or_ui_in_scope: true
    browser_verification_present: false
  delta_vs_phase1b: 'expected.classify_data_type: request -> quality_failure. Provenance: Ben decision 2026-09-28: split incident
