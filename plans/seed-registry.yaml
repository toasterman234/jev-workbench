version: "0.1"
status: planning
description: >
  Seed vocabulary for the Work Judgment System. Reuse Master Repo concepts first,
  selected Cruxible operational primitives second, and local proposals only where
  an authoritative concept does not yet exist. This file is not runtime authority.

authority_order:
  - master-repo
  - cruxible-agent-operation
  - cruxible-project-domain
  - local

registry_entry_contract:
  required:
    - category
    - key
    - title
    - status
    - authority
  statuses:
    - proposed
    - draft
    - active
    - retired
    - superseded
  fields:
    category: Registry category.
    key: Stable machine identifier. Immutable after use by a published judgment or durable record.
    title: Human-readable editable title.
    description: Meaning and intended use.
    status: Registry lifecycle state.
    authority: Source that governs the term's meaning.
    source_ref: Optional authoritative source reference.
    source_version: Optional source revision/version.
    aliases: Alternate names useful for classification.
    lifecycle: Optional lifecycle namespace for state entries.
    supersedes: Optional prior registry key.
    superseded_by: Optional replacing registry key.

fallbacks:
  other_needs_new:
    title: Other / new vocabulary needed
    description: None of the currently active vocabulary fits; propose a new registry entry.
  unclear_needs_review:
    title: Unclear / human review needed
    description: Available context is insufficient or ambiguous; do not invent a label.

