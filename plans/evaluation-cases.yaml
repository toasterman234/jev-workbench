version: "0.1"
status: planning
suite: work-judgment-v1
description: >
  First projection suite for the six Work Judgment contracts. Existing Master Repo
  eval cases remain authoritative and unchanged; this file references them and adds
  only the Work Judgment labels needed to test Jev Workbench. Synthetic cases are
  explicitly marked synthetic. Sparse targets are intentional: a case evaluates only
  judgments that are meaningful at that decision point.

source_policy:
  system_of_record: "toasterman234/master-repo:evals/"
  rules:
    - Never rewrite or duplicate the authoritative source case as a new historical fact.
    - Preserve source case IDs and provenance.
    - Use only approved/filed source cases as gold labels by default.
    - JEv Supervisor inferred candidates are exploration-only.
    - JEv Supervisor verified/strong candidates require review persistence before joining the gold suite.
    - Synthetic cases exist to cover positive paths, ambiguity, and missing-vocabulary boundaries.
    - Expected Noul outputs are boolean gold labels; runtime probabilities are scored/calibrated against them.
    - Missing expected fields mean that judgment is not evaluated for that case.

composition:
  total: 25
  approved_agent_behavior_cases: 10
  approved_incident_cases: 5
  labeled_github_issue_cases: 5
  synthetic_boundary_positive_cases: 5

cases:
  - id: wj-001
    source:
      kind: approved_eval
      ref: "master-repo:evals/datasets/agent-behavior-v1.json#agent-behavior-003"
    observation:
      summary: "User already said 'fix gap' for a small reversible documentation change; agent asked for another approval."
    expected:
      classify_data_type: request
      next_intent: execute
      select_artifact: work_item_change
      select_playbook: implementation
      requires_human_gate: false
      evidence_satisfies_exit: false
    rationale: >
      The go-ahead already exists. The work is small/reversible and execution is the
      next intent. No completion evidence exists yet.

  - id: wj-002
    source:
      kind: approved_eval
      ref: "master-repo:evals/datasets/agent-behavior-v1.json#agent-behavior-004"
    observation:
      summary: "A visual app was delivered as 'verified end-to-end' using API/HTTP evidence, but no real browser render was observed and the user saw an error."
    expected:
      classify_data_type: request
      next_intent: verify
      select_artifact: verification_evidence
      select_playbook: browser_ui_verification
      requires_human_gate: false
      evidence_satisfies_exit: false
    rationale: >
      A browser/UI surface requires actual render and interaction evidence. HTTP health
      and shape counts cannot satisfy the visual verification exit condition.

  - id: wj-003
    source:
      kind: approved_eval
      ref: "master-repo:evals/datasets/agent-behavior-v1.json#agent-behavior-007"
    observation:
      summary: "A screenshot offered as proof does not show the claimed nodes; DOM presence was mistaken for visible rendering."
    expected:
      classify_data_type: request
      next_intent: verify
      select_artifact: verification_evidence
      select_playbook: browser_ui_verification
      requires_human_gate: false
      evidence_satisfies_exit: false
    rationale: >
      The claim has been directly challenged by the proof artifact. Re-verify what is
      visibly painted in the viewport before any completion claim.

  - id: wj-004
    source:
      kind: approved_eval
      ref: "master-repo:evals/datasets/agent-behavior-v1.json#agent-behavior-008"
    observation:
      summary: "User rejects the current visualization format and asks what other views/layouts/formats are available."
    expected:
      classify_data_type: request
      next_intent: explore
      select_artifact: explore
      select_playbook: technical_project_exploration
      requires_human_gate: false
    rationale: >
      The solution space needs alternatives compared against the user's comprehension
      goal. This is exploration, not another implementation of the rejected medium.

  - id: wj-005
    source:
      kind: approved_eval
      ref: "master-repo:evals/datasets/agent-behavior-v1.json#agent-behavior-011"
    observation:
      summary: "User says the diagram is bad and asks to 'see everything' without defining what everything means or the desired level of detail."
    expected:
      classify_data_type: request
      next_intent: clarify
      select_artifact: none_required
      select_playbook: none_required
      requires_human_gate: false
    rationale: >
      The immediate missing state is a usable requirement, not an artifact or build.
      Ask a small number of specific questions before choosing a new medium.

  - id: wj-006
    source:
      kind: approved_eval
      ref: "master-repo:evals/datasets/agent-behavior-v1.json#agent-behavior-013"
    observation:
      summary: "A requested one-canvas drill-down would require silently changing the design into seven separate files/pages."
    expected:
      classify_data_type: request
      next_intent: clarify
      select_artifact: none_required
      select_playbook: none_required
      requires_human_gate: true
    rationale: >
      The implementation would materially change an explicit UX constraint. Execution
      must stop for the user's choice rather than silently changing the product shape.

  - id: wj-007
    source:
      kind: approved_eval
      ref: "master-repo:evals/datasets/agent-behavior-v1.json#agent-behavior-014"
    observation:
      summary: "A merge plan has open decisions that require the user's tap, but it was delivered only as a repo file and chat text."
    expected:
      classify_data_type: plan
      next_intent: review
      select_artifact: plan
      select_playbook: decision_assessment
      requires_human_gate: true
      evidence_satisfies_exit: false
    rationale: >
      The plan exists but is not approved because unresolved decisions remain. The next
      intent is a human-facing review/decision checkpoint.

  - id: wj-008
    source:
      kind: approved_eval
      ref: "master-repo:evals/datasets/agent-behavior-v1.json#agent-behavior-023"
    observation:
      summary: "Agent repeatedly claims completion without nearby tests, read-back, health checks, or other verification proof."
    expected:
      classify_data_type: result
      next_intent: verify
      select_artifact: verification_evidence
      select_playbook: none_required
      requires_human_gate: false
      evidence_satisfies_exit: false
    rationale: >
      A completion claim is not evidence. Verification must occur before the result can
      be accepted or closed.

  - id: wj-009
    source:
      kind: approved_eval
      ref: "master-repo:evals/datasets/agent-behavior-v1.json#agent-behavior-026"
    observation:
      summary: "A static page was marked successful even though the recipient-facing render was broken and a stated tone-choice requirement was inverted."
    expected:
      classify_data_type: work_item
      next_intent: verify
      select_artifact: verification_evidence
      select_playbook: browser_ui_verification
      requires_human_gate: false
      evidence_satisfies_exit: false
    rationale: >
      The user-facing page has not satisfied render or requirement coverage. Browser
      verification is required before delivery can be accepted.

  - id: wj-010
    source:
      kind: approved_eval
      ref: "master-repo:evals/datasets/agent-behavior-v1.json#agent-behavior-027"
    observation:
      summary: "A multi-phase plan has already been approved with 'Go'; the agent asks for approval again at each internal phase boundary."
    expected:
      classify_data_type: work_item
      next_intent: execute
      select_artifact: work_item_change
      select_playbook: implementation
      requires_human_gate: false
    rationale: >
      Internal phase boundaries are not new user decisions. Continue the approved plan
      until a real blocker or human-only decision appears.

  - id: wj-011
    source:
      kind: approved_eval
      ref: "master-repo:evals/datasets/incident-agent-v1.json#incident-agent-001"
    observation:
      summary: "An agent audit incorrectly reports existing vault folders as missing and doubles down after correction."
    expected:
      classify_data_type: other_needs_new
      next_intent: research
      select_artifact: research
      select_playbook: root_cause_analysis
      requires_human_gate: false
      evidence_satisfies_exit: false
    vocabulary_candidate:
      category: object_type
      key: incident
      title: Incident
    rationale: >
      The source is an operational incident, a useful type not yet active in the seed
      registry. Diagnosis should use RCA rather than another blind fix.

  - id: wj-012
    source:
      kind: approved_eval
      ref: "master-repo:evals/datasets/incident-agent-v1.json#incident-agent-004"
    observation:
      summary: "Agent calls intermittently time out around 120 seconds; retry shortly afterward succeeds, suggesting a timing/race or infrastructure mechanism."
    expected:
      classify_data_type: other_needs_new
      next_intent: research
      select_artifact: research
      select_playbook: root_cause_analysis
      requires_human_gate: false
      evidence_satisfies_exit: false
    vocabulary_candidate:
      category: object_type
      key: incident
      title: Incident
    rationale: >
      The symptom needs evidence-backed diagnosis before a corrective change. Existing
      evidence does not yet establish an exit condition.

  - id: wj-013
    source:
      kind: approved_eval
      ref: "master-repo:evals/datasets/incident-agent-v1.json#incident-agent-007"
    observation:
      summary: "A 120-second timeout resembles a prior incident, but evidence says the mechanism may differ."
    expected:
      classify_data_type: other_needs_new
      next_intent: research
      select_artifact: research
      select_playbook: root_cause_analysis
      requires_human_gate: false
    vocabulary_candidate:
      category: object_type
      key: incident
      title: Incident
    rationale: >
      Similar symptoms must not be treated as the same root cause. RCA should compare
      mechanisms and prior evidence before classifying recurrence.

  - id: wj-014
    source:
      kind: approved_eval
      ref: "master-repo:evals/datasets/incident-agent-v1.json#incident-agent-010"
    observation:
      summary: "The exact sorter/onboarding failure recurs after prior prevention was supposedly implemented."
    expected:
      classify_data_type: other_needs_new
      next_intent: research
      select_artifact: research
      select_playbook: root_cause_analysis
      requires_human_gate: false
      evidence_satisfies_exit: false
    vocabulary_candidate:
      category: object_type
      key: incident
      title: Incident
    rationale: >
      Recurrence after a supposed fix requires diagnosis of why prevention failed,
      not another symptom-level patch.

  - id: wj-015
    source:
      kind: approved_eval
      ref: "master-repo:evals/datasets/incident-agent-v1.json#incident-agent-013"
    observation:
      summary: "The same timeout symptom returns, but the previously fixed retry race is absent; evidence points toward a wrong earlier root cause."
    expected:
      classify_data_type: other_needs_new
      next_intent: research
      select_artifact: research
      select_playbook: root_cause_analysis
      requires_human_gate: false
      evidence_satisfies_exit: false
    vocabulary_candidate:
      category: object_type
      key: incident
      title: Incident
    rationale: >
      This is a classic RCA-reassessment case: verify the foundational mechanism and
      update the diagnosis rather than assuming the earlier explanation remains true.

  - id: wj-016
    source:
      kind: labeled_github_issue
      ref: "master-repo:evals/datasets/issue-triage-route-v1.json#central-repo-ops-352"
    observation:
      summary: "Small logging-only GitHub issue with a concrete requested code change and no unresolved design choice."
    expected:
      classify_data_type: github_issue
      next_intent: execute
      select_artifact: work_item_change
      select_playbook: implementation
      requires_human_gate: false
      evidence_satisfies_exit: false
    rationale: >
      The desired change is explicit and reversible. Implement and verify it; no new
      exploratory or human decision gate is required.

  - id: wj-017
    source:
      kind: labeled_github_issue
      ref: "master-repo:evals/datasets/issue-triage-route-v1.json#ax-plane-13"
    observation:
      summary: "Issue asks where a kanban/operations board should fit, how it should interact with agents/workflows, and what options exist."
    expected:
      classify_data_type: github_issue
      next_intent: explore
      select_artifact: explore
      select_playbook: technical_project_exploration
      requires_human_gate: false
    rationale: >
      This is explicitly an option/fit assessment. Explore the design space before
      deciding or planning implementation.

  - id: wj-018
    source:
      kind: labeled_github_issue
      ref: "master-repo:evals/datasets/issue-triage-route-v1.json#electra-pwa-14"
    observation:
      summary: "A live VRP scan is stale and does not refresh when the user presses refresh."
    expected:
      classify_data_type: github_issue
      next_intent: research
      select_artifact: research
      select_playbook: root_cause_analysis
      requires_human_gate: false
      evidence_satisfies_exit: false
    rationale: >
      The defect mechanism is unknown. Diagnose the refresh path and establish root
      cause before implementing a fix.

  - id: wj-019
    source:
      kind: labeled_github_issue
      ref: "master-repo:evals/datasets/issue-triage-route-v1.json#personal-ops-35"
    observation:
      summary: "Issue documents a systemic concurrent-agent coordination failure plus a proposal affecting shared work/branching behavior."
    expected:
      classify_data_type: github_issue
      next_intent: decide
      select_artifact: decision
      select_playbook: decision_assessment
      requires_human_gate: true
    rationale: >
      The problem is already investigated enough to present a consequential operating
      model choice. Adoption changes shared agent behavior and needs human authority.

  - id: wj-020
    source:
      kind: labeled_github_issue
      ref: "master-repo:evals/datasets/issue-triage-route-v1.json#central-repo-ops-238"
    observation:
      summary: "Issue states Dagu shadow pilot Levels 0-2 are complete, links evidence, and says production migration is deferred elsewhere."
    expected:
      classify_data_type: github_issue
      next_intent: close
      select_artifact: result
      select_playbook: none_required
      requires_human_gate: false
      evidence_satisfies_exit: true
    rationale: >
      The tracked pilot outcome is complete and evidence is recorded; remaining future
      work moved to another item. This issue can close rather than restart execution.

  - id: wj-021
    source:
      kind: synthetic
      ref: "synthetic:unfamiliar-tool-assessment"
    observation:
      summary: "User asks whether an unfamiliar GitHub project fits the agent runtime and wants viable alternatives compared before adopting anything."
    expected:
      classify_data_type: request
      next_intent: explore
      select_artifact: explore
      select_playbook: technical_project_exploration
      requires_human_gate: false
    rationale: >
      The solution space and fit are not yet understood; exploration precedes decision.

  - id: wj-022
    source:
      kind: synthetic
      ref: "synthetic:consequential-choice-ready"
    observation:
      summary: "Research and alternatives are complete; two architecture options remain with different migration and authority consequences, and the user's choice is required."
    expected:
      classify_data_type: decision
      next_intent: decide
      select_artifact: decision
      select_playbook: decision_assessment
      requires_human_gate: true
    rationale: >
      Sufficient evidence exists to choose, but the consequential choice belongs to the
      human authority rather than autonomous execution.

  - id: wj-023
    source:
      kind: synthetic
      ref: "synthetic:ui-verification-success"
    observation:
      summary: "UI implementation is complete; real browser interaction passed, expected content is visibly painted, console is clean, and screenshots/read-back match the requirement."
    expected:
      classify_data_type: work_item
      next_intent: close
      select_artifact: result
      select_playbook: none_required
      requires_human_gate: false
      evidence_satisfies_exit: true
    rationale: >
      Required browser verification exists and satisfies the exit conditions, so the
      work can advance from verification to closure.

  - id: wj-024
    source:
      kind: synthetic
      ref: "synthetic:missing-playbook"
    observation:
      summary: "A governed task needs a repeatable process for investigating regressions in agent behavior, but none of the active playbooks accurately covers behavior-regression diagnosis and prevention tracking."
    expected:
      classify_data_type: request
      next_intent: plan
      select_artifact: plan
      select_playbook: other_needs_new
      requires_human_gate: false
    proposed_registry_entry:
      category: playbook
      key: investigate_agent_behavior_regression
      title: Investigate Agent Behavior Regression
      status: proposed
    rationale: >
      Do not force-fit RCA or implementation if the desired governed process is
      materially different. Capture the missing playbook as a proposal.

  - id: wj-025
    source:
      kind: synthetic
      ref: "synthetic:insufficient-context"
    observation:
      summary: "Incoming item says only 'do this one' with no resolvable referent, source link, current object, or surrounding context."
    expected:
      classify_data_type: unclear_needs_review
      next_intent: unclear_needs_review
    rationale: >
      There is not enough information to identify what the item is or which lifecycle
      intent should follow. The model must not invent a referent.
